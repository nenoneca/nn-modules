# SPDX-License-Identifier: Apache-2.0
#
# LXC config for the nn-gw gateway daemon container.  Rendered from
# this template by install-gw_linux.sh — @ROOTFS@ and @STATE_DIR@ are
# substituted with the actual paths.

# ── rootfs + identity ───────────────────────────────────────────────
lxc.uts.name           = nn-gw
lxc.arch               = arm64
lxc.rootfs.path        = dir:@ROOTFS@

# Pull in the stock LXC profile (apparmor, capabilities, cgroups,
# seccomp).  On Debian Trixie / LXC 5+, the distro-specific
# debian.common.conf/debian.userns.conf names were dropped in favour
# of these generic ones.
lxc.include            = /usr/share/lxc/config/common.conf

# ── networking: host networking ────────────────────────────────────
#
# Container shares the host's network namespace.  mDNS multicast +
# the TCP listener on :8770 land directly on the Pi's LAN interfaces.
# Future: switch to macvlan for multiple gateways per host.
lxc.net.0.type         = none

# ── persistent state ───────────────────────────────────────────────
#
# Bind-mount the host's /var/lib/nn-gw onto the container's
# /root/.local/state/nn-gw so gw_identity + hub_crypto + gw_provision
# survive container re-creation.  The daemon's kvstore resolves to
# $XDG_STATE_HOME/nn-gw/kv → /root/.local/state/nn-gw/kv when
# XDG_STATE_HOME is unset and HOME=/root (which it is for the systemd
# unit user we run as).
lxc.mount.entry        = @STATE_DIR@ root/.local/state/nn-gw none bind,create=dir 0 0

# NOTE: mDNS publish is handled by `nn-gw-mdns.service` running on the
# host, NOT from inside the container.  Two avahi-daemons sharing the
# same network namespace (the host's, via lxc.net.0.type=none) thrash
# on hostname-conflict.  The container's daemon runs with --no-mdns and
# the host script reads /var/lib/nn-gw/kv/gw_identity/p256_priv to
# compute the same `nn-gw-XXXXXX` instance name and publishes
# `_nn-gw._tcp` itself.

# ── NCP UART passthrough ───────────────────────────────────────────
#
# gw_linux drives the C6 NCP over /dev/ttyAMA3.  LXC's default device
# whitelist blocks UART/serial nodes; allow + bind-mount it in.
lxc.cgroup2.devices.allow = c 204:67 rwm
lxc.mount.entry = /dev/ttyAMA3 dev/ttyAMA3 none bind,create=file 0 0

# ── lifecycle ──────────────────────────────────────────────────────
lxc.start.auto         = 1
lxc.start.delay        = 5
lxc.start.order        = 50
